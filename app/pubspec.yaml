name: kayfit_app
description: "KayFit — AI fitness and nutrition tracker"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Navigation
  go_router: ^14.0.0

  # State management
  flutter_riverpod: ^2.5.0
  riverpod_annotation: ^2.3.0

  # HTTP
  dio: ^5.4.0

  # Models
  freezed_annotation: ^2.4.0
  json_annotation: ^4.9.0

  # Storage
  shared_preferences: ^2.2.0

  # Fonts
  google_fonts: ^6.2.1

  # i18n
  intl: 0.20.2

  # Media
  image_picker: ^1.1.0
  flutter_image_compress: ^2.3.0
  permission_handler: ^11.3.0

  # Audio recording (voice meal input)
  record: ^6.0.0
  path_provider: ^2.1.0

  # Barcode scanning
  mobile_scanner: ^6.0.0

  # Video (exercise demos)
  video_player: ^2.9.1

  # Network images
  cached_network_image: ^3.3.1

  # URL launcher
  url_launcher: ^6.2.0

  # Markdown
  flutter_markdown: ^0.7.0

  # Firebase
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  firebase_analytics: ^11.3.3
  flutter_local_notifications: ^17.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.0
  freezed: ^2.5.0
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
  generate: true
